<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .wireframe {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: white;
        }

        .image-container {
            position: absolute;
            width: 1820px;
            height: 1024px;
            left: -134px;
            top: 0;
        }

        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            pointer-events: none;
        }

        .title-text {
            position: absolute;
            left: 419px;
            top: 412px;
            font-family: 'Jacquard 12', sans-serif;
            font-size: 200px;
            font-style: normal;
            font-weight: 400;
            line-height: normal;
            color: #060405;
            white-space: nowrap;
        }

        @media (max-width: 1600px) {
            .image-container {
                width: 100%;
                height: auto;
                left: 0;
            }
            
            .title-text {
                font-size: 12vw;
                left: 5%;
                top: 40%;
            }
        }

        @media (max-width: 768px) {
            .title-text {
                font-size: 18vw;
                left: 5%;
                top: 35%;
            }
        }
    </style>
</head>
<body>
    <div class="wireframe">
        <div class="image-container">
            <img src="https://www.figma.com/api/mcp/asset/9a1c98a0-2fd7-4c6b-b109-a55158136389" 
                 alt="House Fly" 
                 class="background-image">
        </div>
        <div class="title-text">text test</div>
    </div>
</body>
</html>
