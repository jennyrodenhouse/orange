<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .wireframe {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: white;
        }

        .image-container {
            position: absolute;
            left: 769px;
            top: 665px;
            width: 502px;
            height: 283px;
        }

        .small-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            pointer-events: none;
        }

        .title-text {
            position: absolute;
            left: 419px;
            top: 412px;
            font-family: 'Jacquard 12', sans-serif;
            font-size: 200px;
            font-style: normal;
            font-weight: 400;
            line-height: normal;
            color: #060405;
        }

        .vector-container {
            position: absolute;
            left: 102.43px;
            top: 77px;
            width: 432.371px;
            height: 233.984px;
        }

        .vector-image {
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 1600px) {
            .title-text {
                font-size: 12vw;
                left: 5%;
                top: 40%;
            }

            .image-container {
                left: 50%;
                top: 60%;
                width: 30vw;
                height: auto;
            }

            .vector-container {
                left: 5%;
                top: 5%;
                width: 25vw;
                height: auto;
            }
        }

        @media (max-width: 768px) {
            .title-text {
                font-size: 18vw;
                left: 5%;
                top: 35%;
            }

            .image-container {
                left: 25%;
                top: 65%;
                width: 50vw;
            }

            .vector-container {
                left: 5%;
                top: 8%;
                width: 40vw;
            }
        }
    </style>
</head>
<body>
    <div class="wireframe">
        <div class="image-container">
            <img src="https://www.figma.com/api/mcp/asset/708118cd-569d-4d79-8451-12cf418abdb3" 
                 alt="House Fly Small" 
                 class="small-image">
        </div>
        <div class="title-text">text test</div>
        <div class="vector-container">
            <img src="https://www.figma.com/api/mcp/asset/c799bc2c-166c-445b-b8f0-d6c3d7346204" 
                 alt="Vector" 
                 class="vector-image">
        </div>
    </div>
</body>
</html>
