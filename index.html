<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange - Multi-page Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Controls -->
    <div class="nav-controls">
        <button class="nav-btn" data-page="1">1</button>
        <button class="nav-btn" data-page="2">2</button>
        <button class="nav-btn" data-page="3">3</button>
    </div>

    <!-- Swipe indicator -->
    <div class="swipe-hint">Swipe or use arrow keys to navigate</div>

    <!-- Page Container -->
    <div class="page-container">
        
        <!-- Page 1 -->
        <div class="page active" id="page-1" data-page="1">
            <div class="house-fly-lg1">
                <img src="https://www.figma.com/api/mcp/asset/cf93fb74-8eee-48ff-a83c-39796a6b1171" 
                     alt="House fly large" 
                     class="background-img">
            </div>
            <a href="#page-2" class="page-text" id="pg1-text">
                <p>text test</p>
            </a>
        </div>

        <!-- Page 2 -->
        <div class="page" id="page-2" data-page="2">
            <a href="#page-3" class="page-text-link">
                <div class="page-text" id="pg2-text">
                    <p>text test</p>
                </div>
            </a>
        </div>

        <!-- Page 3 -->
        <div class="page" id="page-3" data-page="3">
            <div class="house-fly-sm1">
                <img src="https://www.figma.com/api/mcp/asset/8a66a288-a76b-4d51-8201-dbe2b25b7569" 
                     alt="House fly small" 
                     class="foreground-img">
            </div>
            <p class="page-text-static" id="pg3-text">text test</p>
            <a href="#page-1" class="drawing1">
                <div class="drawing1-container">
                    <img src="https://www.figma.com/api/mcp/asset/a32d3a33-a483-4d89-b1bf-a5d810ad6df0" 
                         alt="Drawing" 
                         class="drawing-img">
                </div>
            </a>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
