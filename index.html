<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Design - Interactive Prototype</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Page 1 -->
    <div id="pg1" class="page active" data-page="1">
        <img src="https://www.figma.com/api/mcp/asset/8988c84e-bbb5-4a7a-9f40-f283603b9568" 
             alt="house fly large" 
             class="house-fly-lg">
        <a href="#" class="text-link" data-goto="2">
            <p>text test</p>
        </a>
    </div>

    <!-- Page 2 -->
    <div id="pg2" class="page" data-page="2">
        <a href="#" class="text-link" data-goto="3">
            <p>text test</p>
        </a>
    </div>

    <!-- Page 3 -->
    <div id="pg3" class="page" data-page="3">
        <img src="https://www.figma.com/api/mcp/asset/1199ae8f-f034-4853-ab77-9acf807513f4" 
             alt="house fly small" 
             class="house-fly-sm">
        <img src="https://www.figma.com/api/mcp/asset/625c7ca7-529e-40e1-83d7-3eca5989ce62" 
             alt="drawing" 
             class="drawing">
        <a href="#" class="text-link" data-goto="1">
            <p>text test</p>
        </a>
    </div>

    <!-- Navigation Controls (optional, for testing) -->
    <div class="nav-controls">
        <button class="nav-btn" data-nav="prev">←</button>
        <span class="page-indicator">
            <span class="dot" data-page="1"></span>
            <span class="dot" data-page="2"></span>
            <span class="dot" data-page="3"></span>
        </span>
        <button class="nav-btn" data-nav="next">→</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
